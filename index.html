<script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Вставили твой реальный токен!
        const BOT_TOKEN = '8898711498:AAEjsOmvU0HdWLqJNWTnreFCjsdXhr0hX9w'; 

        async function generateAndSend() {
            const resultText = "🎉 Твой результат: Выпал сектор 100!";

            // 1. Показываем результат ПРЯМО НА ЭКРАНЕ приложения
            document.getElementById("info").innerText = resultText;

            // 2. Получаем ID пользователя Telegram
            const userId = tg.initDataUnsafe?.user?.id;

            if (userId) {
                // 3. Отправляем дубликат в чат Telegram БЕЗ закрытия приложения
                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: userId,
                            text: `📩 **Дублируем результат из приложения:**\n\n${resultText}`,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (e) {
                    console.error("Ошибка отправки:", e);
                }
            }
        }
    </script>
