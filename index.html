<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сокровища Сирен</title>
    <!-- ВАЖНО: Подключение скрипта Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff0055;
            z-index: 10;
        }
        button {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button id="spin-btn" onclick="spin()">🎰 Крутить колесо</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        const prizes = [
            "Скидка 10%",
            "Брови в подарок",
            "Скидка 500р",
            "Уход для губ",
            "Патчи в подарок",
            "Скидка 15%"
        ];

        const colors = ["#ff4b5c", "#3a7bd5", "#00d2ff", "#ffb400", "#9b59b6", "#2ecc71"];
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const numSegments = prizes.length;
        const anglePerSegment = (2 * Math.PI) / numSegments;
        let currentAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            for (let i = 0; i < numSegments; i++) {
                const angle = currentAngle + i * anglePerSegment;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, angle, angle + anglePerSegment);
                ctx.lineTo(150, 150);
                ctx.fill();

                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(angle + anglePerSegment / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 14px Arial";
                ctx.fillText(prizes[i], 140, 5);
                ctx.restore();
            }
        }

        drawWheel();

        function spin() {
            if (isSpinning) return;
            isSpinning = true;

            const btn = document.getElementById("spin-btn");
            btn.disabled = true;

            const totalRotation = Math.PI * 2 * 5 + Math.random() * Math.PI * 2;
            const startAngle = currentAngle;
            const startTime = performance.now();
            const duration = 4000;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = startAngle + totalRotation * easeOut;
                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = (startAngle + totalRotation) % (Math.PI * 2);
                    drawWheel();

                    // Вычисляем победителя
                    const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                    const winningIndex = Math.floor((normalizedAngle + Math.PI / 2) % (2 * Math.PI) / anglePerSegment);
                    const winningPrize = prizes[winningIndex];

                    btn.innerText = "🎁 Получить подарок: " + winningPrize;
                    btn.disabled = false;
                    
                    // Меняем функцию кнопки на отправку данных
                    btn.onclick = function() {
                        try {
                            // Проверяем, запущено ли приложение в Telegram
                            if (tg && tg.sendData) {
                                tg.sendData(winningPrize);
                                tg.close(); // Закрываем Web App
                            } else {
                                alert("Ошибка: Откройте колесо внутри приложения Telegram!");
                            }
                        } catch (e) {
                            alert("Ошибка отправки: " + e.message);
                        }
                    };
                }
            }
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
