<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Мини-Приложение</title>
    <!-- Обязательный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>Привет! 👋</h2>
    <p id="info">Нажми на кнопку ниже</p>

    <button onclick="sendResult()">Сгенерировать информацию</button>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        function sendResult() {
            const secretText = "🎉 Твое предсказание: Сегодня тебя ждет отличный день!";
            
            // 1. Показываем текст прямо в мини-приложении
            document.getElementById("info").innerText = secretText;

            // 2. Отправляем эти же данные обратно боту
            tg.sendData(secretText);
        }
    </script>
</body>
</html>
