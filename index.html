<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        #info {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>Мини-приложение 🎡</h2>
    <button onclick="generateAndSend()">Сгенерировать</button>

    <!-- Сюда выводим текст ВНУТРИ приложения -->
    <div id="info"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ ВСТАВЬ СЮДА ТОКЕН СВОЕГО БОТА
        const BOT_TOKEN = 'ТВОЙ_ТОКЕН_БОТА'; 

        async function generateAndSend() {
            const resultText = "🎉 Твое результат: Выпал сектор 100!";

            // 1. Показываем результат ПРЯМО НА ЭКРАНЕ приложения
            document.getElementById("info").innerText = resultText;

            // 2. Получаем ID пользователя Telegram
            const userId = tg.initDataUnsafe?.user?.id;

            if (userId) {
                // 3. Отправляем дубликат в чат Telegram БЕЗ закрытия приложения
                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: userId,
                            text: `📩 **Дублируем результат из приложения:**\n\n${resultText}`,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (e) {
                    console.error("Ошибка отправки:", e);
                }
            }
        }
    </script>
</body>
</html>
