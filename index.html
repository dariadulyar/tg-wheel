<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сокровища Сирен - Wheel of Fortune</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #141d26;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { 
            margin-bottom: 2px; 
            color: #f39c12;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #95a5a6;
            font-size: 14px;
            margin-bottom: 10px;
        }

        /* Контейнер для котика и колеса */
        .wheel-card {
            position: relative;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border: 3px solid #d4af37; /* Золотая рамка в стиле карт */
            border-radius: 20px;
            padding: 20px 10px 15px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 350px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Котик сверху */
        .cat-container {
            width: 110px;
            height: 90px;
            margin: -35px auto 5px auto;
            background-image: url('cat.png'); /* Если хочешь загрузить картинку котика локально */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер колеса и стрелки */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px auto;
        }

        /* Указатель (стрелка сверху) */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #e74c3c;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        canvas {
            border-radius: 50%;
            border: 4px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.3);
        }

        button {
            padding: 12px 26px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        #info {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
            min-height: 40px;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="wheel-card">
        <!-- Опционально: котик сверху в стиле ретро-карты -->
        <div style="font-size: 45px; margin-bottom: -10px;" title="Ваш пушистый проводник">🐱</div>
        
        <h2>Сокровища Сирен</h2>
        <div class="subtitle">Wheel of Fortune</div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="280" height="280"></canvas>
        </div>

        <button id="spin-btn" onclick="spinWheel()">Испытать удачу 🎡</button>

        <div id="info"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Полные тексты призов (которые отправятся боту)
        const prizes = [
            "Обнять админа 🤗",
            "Сфоткаться с директором 📸",
            "СММ пылесосит прихожую 🧹",
            "Мастер лижет пяточку 👅",
            "Вы кормите мастера 🍔",
            "10 мин в душе с СММ 🚿"
        ];

        // Только символы/эмодзи для секторов колеса, чтобы они выглядели идеально чисто
        const icons = ["🤗", "📸", "🧹", "👅", "🍔", "🚿"];

        // Винтажные премиальные цвета секторов
        const colors = ["#2c3e50", "#16a085", "#d35400", "#8e44ad", "#2980b9", "#c0392b"];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const center = canvas.width / 2;
        const numPrizes = prizes.length;
        const arc = (2 * Math.PI) / numPrizes;

        let currentAngle = 0;
        let isSpinning = false;

        // Рисуем колесо с крупными иконками по центру секторов
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numPrizes; i++) {
                const angle = currentAngle + i * arc;
                
                // Сектор
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(center, center);
                ctx.arc(center, center, center - 4, angle, angle + arc);
                ctx.lineTo(center, center);
                ctx.fill();
                ctx.strokeStyle = "#f1c40f";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Иконка (эмодзи) на секторе
                ctx.save();
                ctx.translate(
                    center + Math.cos(angle + arc / 2) * (center - 65),
                    center + Math.sin(angle + arc / 2) * (center - 65)
                );
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                
                // Делаем смайлики крупными и читаемыми
                ctx.font = "30px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(icons[i], 0, 0);
                
                ctx.restore();
            }
        }

        drawWheel();

        // Функция вращения колеса
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const btn = document.getElementById("spin-btn");
            btn.disabled = true;
            document.getElementById("info.innerText") = "";

            // Выбираем случайный сектор
            const prizeIndex = Math.floor(Math.random() * numPrizes);
            const selectedPrize = prizes[prizeIndex];

            // Рассчитываем физику вращения
            const extraRounds = 6 * 2 * Math.PI; // 6 полных оборотов
            const prizeAngle = (2 * Math.PI) - (prizeIndex * arc) - (arc / 2) - (Math.PI / 2);
            const targetAngle = currentAngle + extraRounds + (prizeAngle - (currentAngle % (2 * Math.PI)));

            const duration = 4500; // 4.5 секунды
            const start = performance.now();

            function animate(time) {
                let progress = (time - start) / duration;
                if (progress > 1) progress = 1;

                // Плавное затухание (ease-out)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = currentAngle + (targetAngle - currentAngle) * (easeOut * 0.05);

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Колесо остановилось — показываем расшифровку!
                    document.getElementById("info").innerHTML = `🎉 Ваш приз:<br><span style="color: #f1c40f; font-size: 20px;">${selectedPrize}</span>`;
                    
                    // Передаем точный текст приза в Telegram-бота с небольшой задержкой
                    setTimeout(() => {
                        tg.sendData(selectedPrize);
                    }, 1500);
                }
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
