<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сокровища Сирен</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Georgia', serif;
            text-align: center;
            background-color: #dbe4dc;
            color: #2c3e50;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Карточный стиль в духе Таро */
        .tarot-card {
            position: relative;
            background: #f4ebd0;
            border: 4px solid #b89742;
            border-radius: 16px;
            padding: 15px 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            max-width: 340px;
            width: 100%;
            box-sizing: border-box;
        }

        h2 { 
            margin: 5px 0 0 0; 
            color: #5c4033;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #8c6d53;
            font-size: 13px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Котик сверху на колесе */
        .cat-top {
            font-size: 42px;
            margin-bottom: -18px;
            z-index: 20;
            position: relative;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }

        /* Контейнер колеса */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 5px auto;
        }

        /* Стрелка сверху */
        .pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 18px solid #c0392b;
            z-index: 30;
        }

        canvas {
            border-radius: 50%;
            border: 5px solid #b89742;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Кнопка в ретро-стиле */
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #c5a059, #8c6d53);
            color: #ffffff;
            border: 2px solid #5c4033;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background: #95a5a6;
            border-color: #7f8c8d;
            cursor: not-allowed;
        }

        #info {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #27ae60;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="tarot-card">
        <!-- Котик-наблюдатель на верхушке колеса -->
        <div class="cat-top">🐱</div>

        <h2>Сокровища Сирен</h2>
        <div class="subtitle">Wheel of Fortune</div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="280" height="280"></canvas>
        </div>

        <button id="spin-btn" onclick="spinWheel()">Испытать удачу 🎡</button>

        <div id="info"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Полные тексты призов
        const prizes = [
            "Обнять админа 🤗",
            "Сфоткаться с директором 📸",
            "СММ пылесосит прихожую 🧹",
            "Мастер лижет пяточку 👅",
            "Вы кормите мастера 🍔",
            "10 мин в душе с СММ 🚿"
        ];

        // Иконки для секторов
        const icons = ["🤗", "📸", "🧹", "👅", "🍔", "🚿"];

        // Винтажные пастельные цвета секций в стиле карт
        const colors = ["#f3d9b1", "#a2d2df", "#ffafcc", "#bdefac", "#ffd166", "#e2ece9"];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const center = canvas.width / 2;
        const numPrizes = prizes.length;
        const arc = (2 * Math.PI) / numPrizes;

        let currentAngle = 0;
        let isSpinning = false;

        // Рисуем колесо
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Рисуем секторы
            for (let i = 0; i < numPrizes; i++) {
                const angle = currentAngle + i * arc;
                
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(center, center);
                ctx.arc(center, center, center - 5, angle, angle + arc);
                ctx.lineTo(center, center);
                ctx.fill();
                ctx.strokeStyle = "#b89742";
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 2. Рисуем иконки строго вертикально (они НЕ крутятся вместе с секторами)
            for (let i = 0; i < numPrizes; i++) {
                // Центр каждого сектора по углам
                const middleAngle = currentAngle + i * arc + arc / 2;
                const distance = 75; // Расстояние от центра до иконки
                
                const x = center + Math.cos(middleAngle) * distance;
                const y = center + Math.sin(middleAngle) * distance;

                ctx.save();
                ctx.translate(x, y);
                
                // Рендерим иконку всегда прямо
                ctx.font = "26px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(icons[i], 0, 0);
                
                ctx.restore();
            }

            // 3. Центральный круг в стиле ретро-карты с короной/цифрой
            ctx.beginPath();
            ctx.arc(center, center, 32, 0, 2 * Math.PI);
            ctx.fillStyle = "#f4ebd0";
            ctx.fill();
            ctx.strokeStyle = "#b89742";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Текст/цифра в центре
            ctx.fillStyle = "#5c4033";
            ctx.font = "bold 16px Georgia";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("👑 1", center, center);
        }

        drawWheel();

        // Функция вращения колеса
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const btn = document.getElementById("spin-btn");
            btn.disabled = true;
            document.getElementById("info").innerText = "";

            const prizeIndex = Math.floor(Math.random() * numPrizes);
            const selectedPrize = prizes[prizeIndex];

            const extraRounds = 6 * 2 * Math.PI; 
            const prizeAngle = (2 * Math.PI) - (prizeIndex * arc) - (arc / 2) - (Math.PI / 2);
            const targetAngle = currentAngle + extraRounds + (prizeAngle - (currentAngle % (2 * Math.PI)));

            const duration = 4500; 
            const start = performance.now();

            function animate(time) {
                let progress = (time - start) / duration;
                if (progress > 1) progress = 1;

                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = currentAngle + (targetAngle - currentAngle) * (easeOut * 0.05);

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Результат
                    document.getElementById("info").innerHTML = `🎉 Ваш приз:<br><span style="color: #8c6d53; font-size: 18px;">${selectedPrize}</span>`;
                    
                    setTimeout(() => {
                        tg.sendData(selectedPrize);
                    }, 1500);
                }
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
