<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сокровища Сирен</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #1c2733;
            color: #ffffff;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #2481cc;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
        }
        #info {
            margin-top: 30px;
            font-size: 20px;
            color: #4bb34b;
        }
    </style>
</head>
<body>

    <h2>🧬 Сокровища Сирен</h2>
    <button onclick="generateAndSend()">Испытать удачу</button>

    <div id="info"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function generateAndSend() {
            const resultText = "🎉 Вы выиграли: Главный приз Сирен!";

            // 1. Показываем результат в мини-приложении
            document.getElementById("info").innerText = resultText;

            // 2. Отправляем данные напрямую боту через встроенный метод Telegram
            // Небольшая задержка в 500мс, чтобы пользователь успел увидеть текст на экране
            setTimeout(() => {
                tg.sendData(resultText);
            }, 500);
        }
    </script>
</body>
</html>
