<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сокровища Сирен — Колесо Удачи</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Анимация салюта -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
            color: #e0e0e0;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #d4af37; /* Золотая рамка */
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        .arrow {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #d4af37;
            z-index: 10;
        }

        button {
            margin-top: 35px;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #121212;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            background: #444444;
            color: #888888;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <h2>Испытай удачу! 🎰</h2>

    <div class="wheel-container">
        <div class="arrow"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <button id="spin-btn" onclick="spinWheel()">Крутить колесо</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        
        // Список призов (при необходимости измени названия)
        const prizes = [
            "Скидка 10%", 
            "Дизайн в подарок", 
            "Скидка 15%", 
            "Уход для рук", 
            "Скидка 20%", 
            "Секретный приз"
        ];
        
        const colors = ["#2b2b36", "#3d3d4e", "#2b2b36", "#3d3d4e", "#2b2b36", "#3d3d4e"];
        const numSegments = prizes.length;
        const segmentAngle = (2 * Math.PI) / numSegments;

        // Рисуем сектора
        for (let i = 0; i < numSegments; i++) {
            ctx.beginPath();
            ctx.fillStyle = colors[i];
            ctx.moveTo(160, 160);
            ctx.arc(160, 160, 160, i * segmentAngle, (i + 1) * segmentAngle);
            ctx.fill();

            // Текст
            ctx.save();
            ctx.translate(160, 160);
            ctx.rotate(i * segmentAngle + segmentAngle / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#d4af37";
            ctx.font = "bold 13px sans-serif";
            ctx.fillText(prizes[i], 145, 5);
            ctx.restore();
        }

        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;

            const winningIndex = Math.floor(Math.random() * numSegments);
            const prize = prizes[winningIndex];

            const degreesPerSegment = 360 / numSegments;
            const stopAngle = 360 * 5 + (270 - (winningIndex * degreesPerSegment + degreesPerSegment / 2));

            canvas.style.transform = `rotate(${stopAngle}deg)`;

            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    // Передаем приз в Telegram
                    tg.sendData(JSON.stringify({ 
                        prize: prize 
                    }));
                }, 1200);

            }, 4000);
        }
    </script>
</body>
</html>
