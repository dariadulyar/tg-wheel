<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сокровища Сирен</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1c1c1e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        .arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff453a;
            z-index: 10;
        }

        .btn {
            margin-top: 30px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            background-color: #0a84ff;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            transition: background-color 0.2s;
        }

        .btn-claim {
            background-color: #30d158;
            display: none; /* Скрыта по умолчанию */
        }

        .btn:disabled {
            background-color: #48484a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="arrow"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <!-- Кнопка вращения -->
    <button id="spin-btn" class="btn" onclick="spinWheel()">Крутить колесо!</button>

    <!-- Кнопка получения подарка -->
    <button id="claim-btn" class="btn btn-claim" onclick="sendReward()">🎁 Получить подарок</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const prizes = ["Скидка 10%", "Промокод 500Р", "Бесплатный кофе", "Попробуй еще!", "Скидка 20%", "Секретный приз"];
        const colors = ["#ff9f0a", "#30d158", "#0a84ff", "#ffd60a", "#bf5af2", "#64d2ff"];
        const numSegments = prizes.length;
        const segmentAngle = (2 * Math.PI) / numSegments;

        let wonPrize = "";

        // Отрисовка колеса
        for (let i = 0; i < numSegments; i++) {
            ctx.beginPath();
            ctx.fillStyle = colors[i];
            ctx.moveTo(150, 150);
            ctx.arc(150, 150, 150, i * segmentAngle, (i + 1) * segmentAngle);
            ctx.fill();

            ctx.save();
            ctx.translate(150, 150);
            ctx.rotate(i * segmentAngle + segmentAngle / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px sans-serif";
            ctx.fillText(prizes[i], 140, 5);
            ctx.restore();
        }

        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;

            const winningIndex = Math.floor(Math.random() * numSegments);
            wonPrize = prizes[winningIndex];

            const degreesPerSegment = 360 / numSegments;
            const stopAngle = 360 * 5 + (270 - (winningIndex * degreesPerSegment + degreesPerSegment / 2));

            canvas.style.transform = `rotate(${stopAngle}deg)`;

            setTimeout(() => {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

                spinBtn.style.display = 'none';
                const claimBtn = document.getElementById('claim-btn');
                claimBtn.style.display = 'block';
            }, 4000);
        }

        // Обновленная функция отправки приза
        function sendReward() {
            const claimBtn = document.getElementById('claim-btn');
            claimBtn.disabled = true;
            claimBtn.innerText = "Отправка...";

            try {
                // Отправляем данные в Telegram
                tg.sendData(JSON.stringify({ prize: wonPrize }));
            } catch (e) {
                alert("Ошибка отправки. Убедитесь, что запускаете колесо через кнопку из чата бота.");
            }

            // Закрываем окно Mini App
            setTimeout(() => {
                tg.close();
            }, 300);
        }
    </script>
</body>
</html>
